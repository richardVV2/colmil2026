/* Helpers de consola */
function findBySeq(seq) {
  var i = seq - 1;
  if (i < 0 || i >= questions.length) return null;
  var q = questions[i];
  return { seq: seq, doc: q[3] !== undefined ? q[3] : null, texto: q[0], opciones: q[1], correcta: ['A','B','C','D'][q[2]] + ' — ' + q[1][q[2]] };
}
function findByDoc(doc) {
  for (var i = 0; i < questions.length; i++) {
    if (questions[i][3] === doc) return findBySeq(i + 1);
  }
  return null;
}
window.findBySeq = findBySeq;
window.findByDoc = findByDoc;

var pool = [];

/* Claves langExam — banco de Lenguaje */
var KEY_HISTORY = 'langExam_v1_history';
var KEY_POOL = 'langExam_v1_pool';
var KEY_SEEN = 'langExam_v1_seen';

/* ============================================================
   UTILIDADES
   ============================================================ */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function makeRange(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

/* ============================================================
   PERSISTENCIA
   ============================================================ */
function saveState() {
  try {
    localStorage.setItem(KEY_HISTORY, JSON.stringify(examHistory));
    localStorage.setItem(KEY_POOL, JSON.stringify(pool));
    var seenArr = [];
    for (var k in seenEver) { if (seenEver[k]) seenArr.push(parseInt(k, 10)); }
    localStorage.setItem(KEY_SEEN, JSON.stringify(seenArr));
  } catch (e) { console.warn('saveState error:', e); }
}
function loadState() {
  try {
    var h = localStorage.getItem(KEY_HISTORY);
    if (h) { examHistory = JSON.parse(h); if (!Array.isArray(examHistory)) examHistory = []; }
    attemptNumber = examHistory.length;
    var p = localStorage.getItem(KEY_POOL);
    if (p) { pool = JSON.parse(p); if (!Array.isArray(pool)) pool = []; }
    else { pool = shuffle(makeRange(questions.length)); }
    var s = localStorage.getItem(KEY_SEEN);
    seenEver = {};
    if (s) {
      var arr = JSON.parse(s);
      if (Array.isArray(arr)) for (var i = 0; i < arr.length; i++) seenEver[arr[i]] = true;
    }
  } catch (e) {
    console.warn('loadState error:', e);
    pool = shuffle(makeRange(questions.length));
    examHistory = []; seenEver = {}; attemptNumber = 0;
  }
}

/* ============================================================
   SELECCIÓN CON COBERTURA TOTAL
   ============================================================ */
function pickQuestions(n) {
  var picked = [];
  var inExam = {};
  var safety = 0;
  while (picked.length < n && safety < 10000) {
    safety++;
    if (pool.length === 0) {
      var remaining = [];
      for (var i = 0; i < questions.length; i++) if (!inExam[i]) remaining.push(i);
      if (remaining.length === 0) break;
      pool = shuffle(remaining);
    }
    var idx = pool.shift();
    if (typeof idx !== 'number' || isNaN(idx) || idx < 0 || idx >= questions.length) continue;
    if (inExam[idx]) continue;
    inExam[idx] = true;
    picked.push(idx);
  }
  return picked;
}

/* ============================================================
   TIMER
   ============================================================ */
function updateTimer() {
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  document.getElementById('timer').textContent = 'Tiempo restante: ' + pad2(m) + ':' + pad2(s);
}
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timeLeft = TIME_MINUTES * 60;
  updateTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(true); }
  }, 1000);
}

/* ============================================================
   INFO
   ============================================================ */
function renderInfo() {
  var total = questions.length;
  var seen = 0;
  for (var k in seenEver) if (seenEver[k]) seen++;
  var pct = total > 0 ? Math.round((seen / total) * 100) : 0;
  document.getElementById('attempt-info').textContent =
    'Intento #' + (attemptNumber + 1) +
    ' · Banco: ' + total + ' preguntas' +
    ' · ' + QUESTIONS_PER_EXAM + ' por examen' +
    ' · Vistas: ' + seen + '/' + total + ' (' + pct + '%)';
}

    var correctText = q[1][q[2]];
    var seq = picked[j] + 1;
    var doc = (q.length >= 4 && typeof q[3] === 'number') ? q[3] : null;

    var normales = [], finales = [];
    for (var o = 0; o < q[1].length; o++) {
      var txt = q[1][o].toLowerCase();
      var esFinal = false;
      for (var t = 0; t < tieBreakers.length; t++) {
        if (txt.indexOf(tieBreakers[t]) !== -1) { esFinal = true; break; }
      }
      if (esFinal) finales.push(q[1][o]); else normales.push(q[1][o]);
    }
    var opciones = shuffle(normales).concat(finales);

    currentQuestions.push({
      seq: seq,
      doc: doc,
      text: q[0],
      options: opciones,
      correctIdx: opciones.indexOf(correctText)
    });
  }

  var examDiv = document.getElementById('exam');
  examDiv.innerHTML = '';

  for (var k = 0; k < currentQuestions.length; k++) {
    var qd = currentQuestions[k];
    var div = document.createElement('div');
    div.className = 'question';

    var p = document.createElement('p');
    p.textContent = (k + 1) + '. ' + qd.text;
    var span = document.createElement('span');
    span.className = 'qid';
    span.textContent = (qd.doc !== null && qd.doc !== qd.seq)
      ? '  (c' + qd.seq + ' · doc #' + qd.doc + ')'
      : '  (#' + qd.seq + ')';
    p.appendChild(span);
    div.appendChild(p);

    for (var x = 0; x < qd.options.length; x++) {
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + k;
      input.value = x;
      label.appendChild(input);
      label.appendChild(document.createTextNode(' ' + qd.options[x]));
      div.appendChild(label);
    }
    examDiv.appendChild(div);
  }

  saveState();
  renderInfo();
  startTimer();
}

/* ============================================================
   CALIFICAR
   ============================================================ */
function submitExam(auto) {
  if (examSubmitted) return;
  examSubmitted = true;
  if (timerInterval) clearInterval(timerInterval);

  var correct = 0;
  var html = '';
  if (auto) html += '<p><strong>Tiempo agotado. Examen enviado automáticamente.</strong></p>';

  for (var i = 0; i < currentQuestions.length; i++) {
    var q = currentQuestions[i];
    var sel = document.querySelector('input[name="q' + i + '"]:checked');
    var selVal = sel ? parseInt(sel.value, 10) : -1;
    var isCorrect = (selVal === q.correctIdx);
    if (isCorrect) correct++;

    var tag = (q.doc !== null && q.doc !== q.seq)
      ? '(c' + q.seq + ' · doc #' + q.doc + ')'
      : '(#' + q.seq + ')';

    html += '<p><strong>' + (i + 1) + '.</strong> ' + q.text +
            ' <span class="qid">' + tag + '</span><br>';
    if (isCorrect) {
      html += '<span class="correct">Correcto: ' + q.options[q.correctIdx] + '</span></p>';
    } else {
      var given = selVal >= 0 ? q.options[selVal] : 'Sin respuesta';
      html += '<span class="incorrect">Tu respuesta: ' + given + '</span><br>';
      html += '<span class="correct">Correcto: ' + q.options[q.correctIdx] + '</span></p>';
    }
  }

  var total = currentQuestions.length;
  var pct = total > 0 ? ((correct / total) * 100).toFixed(1) : '0.0';
  html = '<h2>Calificación: ' + correct + '/' + total + ' (' + pct + '%)</h2>' + html;
  document.getElementById('result').innerHTML = html;

  attemptNumber++;
  examHistory.push({
    attempt: attemptNumber,
    date: new Date().toLocaleString(),
    correct: correct, total: total, pct: pct, auto: !!auto
  });
  saveState();
  renderInfo();
  renderHistory();
  document.getElementById('submitBtn').disabled = true;

  var r = document.getElementById('result');
  if (r.scrollIntoView) r.scrollIntoView({ behavior: 'smooth' });
}

/* ============================================================
   HISTORIAL
   ============================================================ */
function renderHistory() {
  var div = document.getElementById('history');
  if (examHistory.length === 0) { div.innerHTML = ''; return; }
  var html = '<h2>Historial de intentos</h2><table><thead><tr>' +
             '<th>Intento</th><th>Fecha</th><th>Aciertos</th><th>%</th>' +
             '</tr></thead><tbody>';
  for (var i = 0; i < examHistory.length; i++) {
    var h = examHistory[i];
    var cls = parseFloat(h.pct) >= 70 ? 'good' : 'bad';
    html += '<tr><td>' + h.attempt + '</td><td>' + h.date + '</td>' +
            '<td>' + h.correct + '/' + h.total + '</td>' +
            '<td class="' + cls + '">' + h.pct + '%' + (h.auto ? ' (auto)' : '') + '</td></tr>';
  }
  html += '</tbody></table>';
  div.innerHTML = html;
}
function clearHistory() {
  if (!confirm('¿Borrar todo el historial y reiniciar el progreso?')) return;
  examHistory = []; attemptNumber = 0; seenEver = {};
  pool = shuffle(makeRange(questions.length));
  try {
    localStorage.removeItem(KEY_HISTORY);
    localStorage.removeItem(KEY_POOL);
    localStorage.removeItem(KEY_SEEN);
  } catch (e) {}
  renderHistory();
  renderExam();
}

/* ============================================================
   VALIDACIÓN DEL BANCO
   ============================================================ */
(function validarBanco() {
  var errores = [];
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    var tag = 'c' + (i + 1);
    if (!Array.isArray(q) || (q.length !== 3 && q.length !== 4)) {
      errores.push(tag + ': formato inválido'); continue;
    }
    if (!Array.isArray(q[1]) || q[1].length < 2) {
      errores.push(tag + ': sin opciones'); continue;
    }
    if (typeof q[2] !== 'number' || q[2] < 0 || q[2] >= q[1].length) {
      errores.push(tag + ': índice correcto fuera de rango (' + q[2] + ')');
    }
    if (q.length === 4 && (typeof q[3] !== 'number' || q[3] <= 0)) {
      errores.push(tag + ': número original inválido (' + q[3] + ')');
    }
  }
  if (errores.length > 0) {
    console.error('Errores en el banco de preguntas:', errores);
    var box = document.createElement('div');
    box.style.cssText = 'background:#fee;color:#900;padding:10px;margin:10px 0;border:1px solid #c00;border-radius:5px;font-family:monospace;font-size:12px;';
    box.innerHTML = '<strong>' + errores.length + ' error(es) en el banco:</strong><br>' + errores.join('<br>');
    document.querySelector('.container').insertBefore(box, document.querySelector('#timer'));
  }
})();

/* ============================================================
   AVISO AL CERRAR/RECARGAR
   ============================================================ */
window.addEventListener('beforeunload', function(e) {
  if (!examSubmitted && document.querySelector('input[type="radio"]:checked')) {
    e.preventDefault(); e.returnValue = '';
  }
});

/* ============================================================
   BOTONES
   ============================================================ */
document.getElementById('submitBtn').addEventListener('click', function() { submitExam(false); });
document.getElementById('resetBtn').addEventListener('click', function() {
  var hayRespuestas = false;
  for (var i = 0; i < currentQuestions.length; i++) {
    if (document.querySelector('input[name="q' + i + '"]:checked')) { hayRespuestas = true; break; }
  }
  if (hayRespuestas && !examSubmitted) {
    if (!confirm('Tienes respuestas sin calificar. ¿Seguro que quieres empezar otro examen?')) return;
  }
  renderExam();
});
document.getElementById('clearBtn').addEventListener('click', clearHistory);

/* ============================================================
   ARRANQUE
   ============================================================ */
loadState();
renderHistory();
renderExam();
</script>
