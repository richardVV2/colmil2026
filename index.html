let timeLeft = 20 * 60;
let timerInterval;
let currentQuestions = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = `Tiempo restante: ${m}:${s}`;
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 20 * 60;
  updateTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam(true);
    }
  }, 1000);
}

function renderExam() {
  const examDiv = document.getElementById('exam');
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '';
  examDiv.innerHTML = '';
  document.getElementById('submitBtn').disabled = false;

  currentQuestions = shuffle(questions).slice(0, 20).map(q => {
    const correctText = q[1][q[2]];
    const shuffledOptions = shuffle(q[1]);
    const correctIndex = shuffledOptions.indexOf(correctText);
    return [q[0], shuffledOptions, correctIndex];
  });

  currentQuestions.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<p>${idx + 1}. ${q[0]}</p>`;
    q[1].forEach((opt, optIdx) => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = `q${idx}`;
      input.value = optIdx;
      label.appendChild(input);
      label.appendChild(document.createTextNode(' ' + opt));
      div.appendChild(label);
    });
    examDiv.appendChild(div);
  });

  startTimer();
}

function submitExam(auto = false) {
  clearInterval(timerInterval);
  let score = 0;
  const resultDiv = document.getElementById('result');
  let html = '';
  if (auto) html += '<p><strong>Tiempo agotado. Examen enviado automáticamente.</strong></p>';

  currentQuestions.forEach((q, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const selectedVal = selected ? parseInt(selected.value) : -1;
    const isCorrect = selectedVal === q[2];
    if (isCorrect) score += 5;

    html += `<p><strong>${idx + 1}. ${q[0]}</strong><br>`;
    if (isCorrect) {
      html += `<span class="correct">Correcto: ${q[1][q[2]]}</span></p>`;
    } else {
      const selectedText = selectedVal >= 0 ? q[1][selectedVal] : 'Sin respuesta';
      html += `<span class="incorrect">Tu respuesta: ${selectedText}</span><br>`;
      html += `<span class="correct">Correcto: ${q[1][q[2]]}</span></p>`;
    }
  });

  html = `<h2>Calificación: ${score}/100</h2>` + html;
  resultDiv.innerHTML = html;
  document.getElementById('submitBtn').disabled = true;
}

document.getElementById('submitBtn').addEventListener('click', () => submitExam(false));
document.getElementById('resetBtn').addEventListener('click', renderExam);

renderExam();
</script>
</body>
</html>
